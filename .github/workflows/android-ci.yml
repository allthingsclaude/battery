name: Android CI

# A file of its own rather than a job inside ci.yml, for the same reason
# `android-release.yml` sits beside `release.yml` and `ios-release.yml`: the
# three platforms build on different runners, at different costs, and on
# different cadences.
#
# The cost part is not incidental. `ci.yml` runs on `macos-26`, which bills at a
# multiple of an ubuntu runner, so widening *its* triggers to cover Android
# branches would spend macOS minutes on every push that cannot affect the Mac or
# iOS builds at all.
on:
  push:
    # Feature branches included deliberately. `ci.yml` fires only on main and on
    # pull requests against it, which means a long-lived branch gets no CI until
    # the moment it is proposed for merge — the worst possible time to discover
    # the runner cannot resolve compileSdk. The Android port was built on such a
    # branch and went through CI zero times.
    branches: [main, 'android/**']
    paths:
      - 'android/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'fixtures/**'
      - '.github/workflows/android-ci.yml'
  # Note this only surfaces a "Run workflow" button once the file is on the
  # repository's *default* branch — GitHub does not offer manual dispatch for a
  # workflow that exists only on a feature branch. The push trigger above is
  # what covers that case, because push events use the workflow file from the
  # ref being pushed.
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # JDK 17 explicitly. A dev machine may have 26 and the build targets 17
      # bytecode without pinning a toolchain, but CI should not inherit whatever
      # the runner image ships this month.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # compileSdk 37 is newer than the runner image is likely to ship, so the
      # platform has to be fetched. Doing it explicitly, rather than leaving it
      # to AGP's auto-download, means a missing SDK fails here with an obvious
      # message instead of somewhere inside a Gradle stack trace.
      - name: Install compileSdk platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || \
            echo "::warning::platforms;android-37 unavailable — falling back to AGP auto-download"

      # core/ first and on its own: it is pure JVM, it holds the golden fixtures
      # shared with the Swift suite, and it fails fast. A break here means the
      # Kotlin port has drifted from ios/BatteryKit/, which is worth surfacing
      # before spending three minutes on an APK.
      - name: Test core (golden fixtures)
        working-directory: android
        run: ./gradlew :core:test

      - name: Build (unsigned)
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-report
          path: android/core/build/reports/tests/test
