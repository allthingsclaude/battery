name: Android Release

# `android-v*` is a third tag namespace beside `v*` (Mac) and `ios-v*` (iOS),
# for the same reason `ios-v*` exists: the three ship on their own cadences and
# an Android patch should not cut a menu-bar release.
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0), without the android-v prefix'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # versionCode is the commit count; a shallow clone gives 1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The dispatch input arrives through `env`, not `${{ }}` inside the script.
      # Interpolated directly it is pasted into the shell before bash sees it, so
      # a version of `x"; curl … | sh; "` runs as a command — in a job that holds
      # the release signing key and `contents: write`. Dispatching needs write
      # access already, which caps the severity, not the blast radius.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # Derived, never `github.ref_name`. On a tag push the two agree, but on
          # workflow_dispatch ref_name is the branch — so the dispatch path, which
          # exists precisely to cut a release without a tag, published one tagged
          # `main`. ReleaseFeed filters on the `android-v` prefix, so that release
          # would also have been invisible to every installed app.
          echo "tag=android-v$VERSION" >> "$GITHUB_OUTPUT"
          # Like the iOS build, versionCode is the commit count: it only has to
          # increase, and deriving it removes a second place to remember to bump.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Fail before the build rather than after it. A missing secret otherwise
      # surfaces as an opaque signing error several minutes in.
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ]          && missing="$missing ANDROID_KEYSTORE"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]         && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]      && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::ANDROID_KEYSTORE is base64 of the .jks — see android/README.md"
            exit 1
          fi

      - name: Test core
        working-directory: android
        run: ./gradlew :core:test

      # printf, not echo: echo mangles a payload that happens to start with -n or
      # -e, and base64 of a .jks can. Through env for the same reason as above.
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Prove the credentials before spending two minutes building with them.
      # The step above checks the secrets are *present*; present is not correct,
      # and the first real run of this workflow proved the difference by failing
      # at `:app:packageRelease`, 108 seconds in.
      #
      # This must use the KeyStore API and not keytool. keytool *ignores*
      # `-keypass` for PKCS12 keystores — it says so at generation time and then
      # accepts any value on later commands — so a keytool-based check passes
      # with a wrong key password and proves nothing. AGP calls
      # `KeyStore.getKey(alias, keyPassword)`, which does apply it, which is why
      # Gradle failed where keytool would not have. The snippet below is that
      # exact call, and it reproduces the identical UnrecoverableKeyException.
      - name: Verify signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/VerifyKeystore.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;

          public class VerifyKeystore {
              public static void main(String[] args) throws Exception {
                  String path = args[0], storePass = args[1];
                  String alias = args[2], keyPass = args[3];
                  Exception last = null;
                  for (String type : new String[] { "PKCS12", "JKS" }) {
                      try {
                          KeyStore ks = KeyStore.getInstance(type);
                          try (FileInputStream in = new FileInputStream(path)) {
                              ks.load(in, storePass.toCharArray());
                          }
                          if (!ks.containsAlias(alias)) {
                              System.err.println("ALIAS_NOT_FOUND");
                              System.exit(2);
                          }
                          if (ks.getKey(alias, keyPass.toCharArray()) == null) {
                              System.err.println("NO_KEY_FOR_ALIAS");
                              System.exit(2);
                          }
                          System.out.println("verified (" + type + ")");
                          return;
                      } catch (Exception e) { last = e; }
                  }
                  System.err.println("FAILED: " + last);
                  System.exit(1);
              }
          }
          JAVA
          if ! java "$RUNNER_TEMP/VerifyKeystore.java" \
                 "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" \
                 "$KEY_ALIAS" "$KEY_PASSWORD"; then
            echo "::error::Signing credentials are wrong. If the store opened but the"
            echo "::error::key would not decrypt, ANDROID_KEY_PASSWORD is the problem:"
            echo "::error::PKCS12 — keytool's default since JDK 9 — does not support a"
            echo "::error::key password different from the store password, and prints"
            echo "::error::'Ignoring user-specified -keypass value' when you set one."
            echo "::error::So the key is protected by the STORE password. Set"
            echo "::error::ANDROID_KEY_PASSWORD to the same value as"
            echo "::error::ANDROID_KEYSTORE_PASSWORD. The keystore itself is fine and"
            echo "::error::does not need regenerating."
            exit 1
          fi

      - name: Build signed APK
        working-directory: android
        env:
          BATTERY_KEYSTORE: ${{ runner.temp }}/release.jks
          BATTERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BATTERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BATTERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Derived from the dispatch input, so it carries the same taint.
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # releaseRepo is where this APK will look for its own updates. Derived
          # from the repository being built, not hardcoded, so a fork's build
          # finds the fork's releases. Hardcoded upstream, a fork build polls
          # allthingsclaude/battery, compares its newest tag against its own
          # version, and reports "up to date" forever — which is indistinguishable
          # from a working updater, and the reason this is derived at all.
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            -PreleaseRepo="$GITHUB_REPOSITORY"

      - name: Rename artifact
        id: artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DST="battery-$VERSION_NAME.apk"
          mv "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"

      # Always remove the keystore, including on failure. A signing key left in
      # a runner's temp directory is the one artifact that must never outlive
      # the job.
      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ${{ steps.artifact.outputs.path }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Battery for Android ${{ steps.version.outputs.name }}
          body: |
            Sideload build. Download the APK below and open it on the device.

            Requires Android 12 (API 31) or later. The lock-screen Live Update
            needs Android 16 (API 36) — on One UI 8.5 that is a Galaxy S24 or
            newer.
          generate_release_notes: true
