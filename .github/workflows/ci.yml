name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # macos-26 (Xcode 26 / macOS 26 SDK) is required: PanelRootView uses the
    # Liquid Glass `glassEffect` API, which only exists in the macOS 26 SDK.
    # macos-latest still resolves to macOS 15 / Xcode 16.4, where it won't compile.
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build
        run: swift build

      - name: Test
        run: swift test
